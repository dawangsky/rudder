# 默认配置：不含真实密码。本地请使用 profile=local + application-local.yml
server:
  port: 8080

rudder:
  persistence:
    enabled: false
  ws:
    port: 8081
    # 协议层心跳：写空闲发 Ping；读空闲（含未收到 Pong）断连。浏览器会自动回 Pong。
    writer-idle-seconds: 30
    reader-idle-seconds: 60

spring:
  application:
    name: rudder-server
  datasource:
    url: jdbc:mysql://${RUDDER_MYSQL_HOST:127.0.0.1}:${RUDDER_MYSQL_PORT:3306}/${RUDDER_MYSQL_DB:rudder}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${RUDDER_MYSQL_USER:rudder}
    password: ${RUDDER_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${RUDDER_REDIS_HOST:127.0.0.1}
      port: ${RUDDER_REDIS_PORT:6379}
      password: ${RUDDER_REDIS_PASSWORD:}
      database: ${RUDDER_REDIS_DB:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.rudder.server: INFO
